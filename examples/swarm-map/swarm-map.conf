# Swarm Map container tunables. Sourced by setup.sh and verify.sh (bash).
# Literals only, no secrets. All sizes are GiB.

NAME=swarm-map
IMAGE=images:debian/trixie
STORAGE_POOL=default
CPU=4
MEMORY=8GiB
# Empty = no root size override. Advisory on a dir pool (no quota), but would
# become a hard cap on btrfs/zfs/lvm pools; set only if that is intended.
ROOT_SIZE=
MIN_HOST_FREE_GIB=25

SWARM_MAP_REPO=https://github.com/cyborg-garden/swarm-map.git
SWARM_MAP_REF=46bec904b75e5a1a201238c05e074e9978d6916b

# Version pins. Must be replaced with literals by the implementer; setup.sh
# refuses to run while any value is empty or still __SET_ME__.
NODE_VERSION=24.21.0
PNPM_VERSION=10.34.6
DOCKER_VERSION=5:29.9.0-1~debian.13~trixie
DOCKER_APT_KEY_FPR=9DC858229FC7DD38854AE2D88D81803C0EBFCD88

APP_PORT=3000

# llama-server runs on the LXD host and must listen on a non-loopback address
# (--host 0.0.0.0 --port 8080 --jinja). LLAMA_MODEL empty = first id from /v1/models.
LLAMA_URL=http://192.168.1.10:8080
LLAMA_MODEL=

# Ports published by nested containers (agents, Letta) are LAN-exposed by
# decision: the LAN is trusted and there is no host-level port filtering.

ENABLE_LETTA=0
REQUIRE_APPARMOR=1

# verify.sh only: throwaway images pulled inside the container, and the
# operator-token login endpoint (POST JSON {token}).
# curlimages/curl:8.5.0 exists for amd64; hello-world only publishes a floating tag.
VERIFY_CURL_IMAGE=curlimages/curl:8.5.0
VERIFY_HELLO_IMAGE=hello-world:latest
LOGIN_PATH=/api/auth/login
